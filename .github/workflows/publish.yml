name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# npm trusted publishing (OIDC): no token. The publisher is set in the
# package's npmjs.com settings for Sangkwun/notion-to-email + publish.yml.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm CLI 11.5.1 or later
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm publish
